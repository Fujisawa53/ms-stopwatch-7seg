:root{ --fg:#FF9500; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{
  height:100%;
  background:#0c0c0e;
  overflow:hidden;
  font-family:-apple-system,system-ui,sans-serif;
  touch-action:manipulation;
}
body{ color:var(--fg); cursor:pointer; }
/* #stage = 常に横位置のキャンバス。縦持ち時は 90° 回転して横レイアウトを強制 */
#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  /* 左右はノッチ/インカメラ回避のため最低 6vmax 確保 (長辺基準) */
  padding:0 6vmax;
}
/* 縦持ち時: JS が実ピクセル width/height(=innerHeight/innerWidth) を付与し .rot を付ける。
   角アンカー + rotate で viewport にピッタリ充填 (top:50% 等のビューポート% に依存せず iOS でもズレない) */
#stage.rot{
  inset:auto;
  top:0;
  left:0;
  transform-origin:top left;
  transform:rotate(90deg) translateY(-100%);
}
#display{
  display:flex;
  align-items:baseline;
  line-height:0.9;
  white-space:nowrap;
  font-family:'DSEG7',monospace;
}
/* 下部バー: 左=FPS / 右=ツール(パレット + 復帰)。
   横持ち(通常)時の safe-area: 左右はノッチ耳、下端はホームインジケータ */
#bar{
  position:absolute;
  left:calc(6vmax + env(safe-area-inset-left));
  right:calc(6vmax + env(safe-area-inset-right));
  bottom:calc(1.8vmin + env(safe-area-inset-bottom));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:3vmax;
}
/* 縦持ち(回転)時の safe-area 再割り当て:
   回転で landscape-left→画面上端 / landscape-right→画面下端(ホームインジケータ) /
   landscape-bottom→画面左端 に軸が入れ替わるため、env を対応する辺へ付け替える。
   これでツール(landscape-right=画面下端)がホームインジケータより内側に収まり、切れない */
#stage.rot #bar{
  left:calc(6vmax + env(safe-area-inset-top));
  right:calc(6vmax + env(safe-area-inset-bottom));
  bottom:calc(1.8vmin + env(safe-area-inset-left));
}
#fps{
  flex:0 0 auto;
  text-align:left;
  font-family:ui-monospace,'SF Mono','Menlo',monospace;
  font-variant-numeric:tabular-nums;
  font-size:1.9vmax;
  font-weight:500;
  letter-spacing:0.14em;
  color:var(--fg);
  opacity:0.3;
}
#tools{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:2.8vmax;
}
#tools button{
  display:flex;
  align-items:center;
  justify-content:center;
  background:none;
  border:none;
  padding:0.6vmax 0;
  cursor:pointer;
  color:var(--fg);
  opacity:0.5;
}
#tools button:active{transform:scale(0.9)}
#palette svg, #reset svg{ width:2.5vmax; height:2.5vmax; }
#reset svg{ fill:currentColor; }
#palette .ring{ fill:none; stroke:currentColor; stroke-width:2.1; }
#palette .dot{ fill:currentColor; }
/* 幅(長辺)基準で「S.MMM」が必ず収まり最大化 */
#sec, #dot{
  font-size:14vmax;
  opacity:0.5;
}
#ms{
  font-size:25vmax;
  margin-left:0.04em;
}
/* ▼ 診断用: URL に #debug を付けた時だけ表示 (実測値オーバーレイ + 中心クロスヘア) */
#dbg{
  position:fixed; top:env(safe-area-inset-top); left:0; right:0; z-index:99;
  display:none; padding:3px 6px; text-align:center;
  font:600 11px/1.4 ui-monospace,'SF Mono',monospace; letter-spacing:0;
  color:#0FA03E; background:rgba(0,0,0,0.62);
}
#cross{ position:fixed; inset:0; z-index:98; display:none; pointer-events:none; }
#cross::before{ content:''; position:absolute; top:50%; left:0; right:0; height:1px; background:#0FA03E; opacity:0.55; }
#cross::after{ content:''; position:absolute; left:50%; top:0; bottom:0; width:1px; background:#0FA03E; opacity:0.55; }
/* safe-area 実測用プローブ (不可視) */
#safeprobe{
  position:fixed; top:0; left:0; width:0; height:0; visibility:hidden; pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
</style>
</head>
<body>
<div id="stage">
<div id="display">
  <span id="sec">0</span><span id="dot">.</span><span id="ms">000</span>
</div>
<div id="bar">
  <div id="fps">--FPS</div>
  <div id="tools">
    <button id="palette" type="button" aria-label="palette">
      <svg viewBox="0 0 24 24">
        <circle class="ring" cx="12" cy="12" r="6"/>
        <circle class="dot" cx="12"    cy="2.4"  r="1.4"/>
        <circle class="dot" cx="20.31" cy="7.2"  r="1.4"/>
        <circle class="dot" cx="20.31" cy="16.8" r="1.4"/>
        <circle class="dot" cx="12"    cy="21.6" r="1.4"/>
        <circle class="dot" cx="3.69"  cy="16.8" r="1.4"/>
        <circle class="dot" cx="3.69"  cy="7.2"  r="1.4"/>
      </svg>
    </button>
    <button id="reset" type="button" aria-label="reset">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
      </svg>
    </button>
  </div>
</div>
</div>
<div id="cross"></div>
<div id="dbg"></div>
<div id="safeprobe"></div>
<script>
'use strict';
const secEl = document.getElementById('sec');
const msEl  = document.getElementById('ms');
const fpsEl = document.getElementById('fps');
let startTime = 0, elapsed = 0, running = false;

// 常に横レイアウト: 縦持ち時はステージを実ピクセルで横向きに組んで 90° 回転。
// 寸法は「物理画面全体」= screen から組み、画面中央に正しく中央寄せする。
//   ・visualViewport は standalone で下部(ホームインジケータ帯)を除いた高さを返し、
//     それで組むとステージが下端まで届かず上寄りになる (v24 の不具合)。
//   ・よって screen で画面全体を充填して中央寄せし、下端ツールの切れは
//     バー側の safe-area (#stage.rot #bar) だけで内側に逃がす。
const stageEl = document.getElementById('stage');
// 縦持ち時は screen 基準でステージを横向きに組み、中身は flex で自然に中央寄せ(補正なし)。
// ※ v26〜v30 の「自己補正(recenter)」は仮定が外れて中央をズラしていたため全撤去し、
//   v23/v25 の自然な中央寄せに戻した。
function layoutStage(){
  const sw = screen.width  || window.innerWidth;
  const sh = screen.height || window.innerHeight;
  const LONG  = Math.max(sw, sh);
  const SHORT = Math.min(sw, sh);
  const vv = window.visualViewport;
  const portrait = vv ? vv.height > vv.width : window.innerHeight > window.innerWidth;
  if (portrait){          // 縦持ち → 横レイアウトを回転表示
    stageEl.style.width  = LONG  + 'px';
    stageEl.style.height = SHORT + 'px';
    stageEl.classList.add('rot');
  } else {                // 横持ち → 通常
    stageEl.style.width  = '';
    stageEl.style.height = '';
    stageEl.classList.remove('rot');
  }
  updateDebug();
}
['resize','orientationchange'].forEach(ev => window.addEventListener(ev, layoutStage));
if (window.visualViewport) window.visualViewport.addEventListener('resize', layoutStage);

// 診断: URL に #debug が付いている時だけ、実測値とクロスヘアを表示
const dbgEl = document.getElementById('dbg');
const crossEl = document.getElementById('cross');
function getSafe(){
  const s = getComputedStyle(document.getElementById('safeprobe'));
  return `${s.paddingTop}/${s.paddingRight}/${s.paddingBottom}/${s.paddingLeft}`;
}
function updateDebug(){
  if (location.hash !== '#debug'){ dbgEl.style.display='none'; crossEl.style.display='none'; return; }
  dbgEl.style.display = 'block';
  crossEl.style.display = 'block';
  const vv = window.visualViewport;
  dbgEl.textContent =
    `inner ${window.innerWidth}x${window.innerHeight} | `+
    `screen ${screen.width}x${screen.height} | `+
    `vv ${vv ? Math.round(vv.width)+'x'+Math.round(vv.height)+'@y'+Math.round(vv.offsetTop) : '-'} | `+
    `docEl ${document.documentElement.clientWidth}x${document.documentElement.clientHeight} | `+
    `safe ${getSafe()}`;
}
window.addEventListener('hashchange', layoutStage);
layoutStage();
// 「60FPS」を 3 回タップで #debug 表示を ON/OFF（インストール済みアプリのまま実数値を確認できる）
let fpsTaps = 0, fpsTapTimer = null;
fpsEl.addEventListener('click', (e) => {
  e.stopPropagation();
  fpsTaps++;
  clearTimeout(fpsTapTimer);
  fpsTapTimer = setTimeout(() => { fpsTaps = 0; }, 1500);
  if (fpsTaps >= 3){
    fpsTaps = 0;
    location.hash = (location.hash === '#debug') ? '' : '#debug';
    layoutStage();
  }
});

function render(t){
  const total = Math.floor(t);
  secEl.textContent = String(Math.floor(total / 1000) % 100).padStart(2, '0');
  msEl.textContent  = String(total % 1000).padStart(3, '0');
}

// 常駐ループ: fps を常時計測し、計測中はストップウォッチも描画する
let frames = 0, fpsAnchor = 0;
function loop(now){
  frames++;
  if (!fpsAnchor) fpsAnchor = now;
  const span = now - fpsAnchor;
  if (span >= 500){
    fpsEl.textContent = Math.round(frames * 1000 / span) + 'FPS';
    frames = 0;
    fpsAnchor = now;
  }
  if (running) render(elapsed + (performance.now() - startTime));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startStop(){
  if (running){
    elapsed += performance.now() - startTime;
    running = false;
    render(elapsed);
  } else {
    startTime = performance.now();
    running = true;
  }
}
function reset(){
  running = false;
  elapsed = 0;
  render(0);
}
let holdTimer = null, longPress = false;
document.body.addEventListener('pointerdown', () => {
  longPress = false;
  holdTimer = setTimeout(() => { longPress = true; reset(); }, 500);
});
document.body.addEventListener('pointerup', () => {
  clearTimeout(holdTimer);
  if (!longPress) startStop();
});
document.body.addEventListener('pointercancel', () => clearTimeout(holdTimer));
document.addEventListener('dblclick', e => e.preventDefault());

// 下部バーはタップしても start/stop を発火させない (中央の計時表示だけが操作対象)
const bar = document.getElementById('bar');
['pointerdown','pointerup','pointercancel'].forEach(ev =>
  bar.addEventListener(ev, e => { clearTimeout(holdTimer); e.stopPropagation(); })
);
// RESET ボタン
document.getElementById('reset').addEventListener('click', e => {
  e.stopPropagation();
  reset();
});
// パレット: タップで全体の文字色を循環切替 (選択は保存)
const FG_COLORS = ['#FF9500','#0FA03E','#FFFFFF','#DC143C','#FFD60A','#64D2FF','#1D4ED8','#BF5AF2'];
let fgIndex = 0;
function applyFg(){
  document.documentElement.style.setProperty('--fg', FG_COLORS[fgIndex]);
  try { localStorage.setItem('msc_fg', String(fgIndex)); } catch (e) {}
}
try {
  const saved = parseInt(localStorage.getItem('msc_fg'), 10);
  if (!isNaN(saved) && saved >= 0 && saved < FG_COLORS.length) fgIndex = saved;
} catch (e) {}
applyFg();
document.getElementById('palette').addEventListener('click', e => {
  e.stopPropagation();
  fgIndex = (fgIndex + 1) % FG_COLORS.length;
  applyFg();
});
// SVG など子要素経由のタップでもバブリングを確実に止める
['reset','palette'].forEach(id =>
  document.getElementById(id).addEventListener('pointerup', e => e.stopPropagation())
);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running){
    elapsed += performance.now() - startTime;
    startTime = performance.now();
  }
});
render(0);

// オフライン起動用 Service Worker (file:// 直開き時は失敗しても無視)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
